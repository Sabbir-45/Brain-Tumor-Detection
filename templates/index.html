<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brain Tumor Detection | MRI Classifier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom right, #0d1b2a, #1b263b, #415a77);
            min-height: 100vh;
            color: #fff;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
        }

        .upload-box {
            padding: 30px;
            border: 2px dashed rgba(255,255,255,0.6);
            border-radius: 15px;
            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #66ccff;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow-lg py-3">
        <div class="container">
            <span class="navbar-brand fw-bold fs-3">🧠 Brain Tumor Detection</span>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

        <div class="card-glass text-center" style="max-width: 550px; width: 100%;">
            <h2 class="mb-3">Upload MRI Scan</h2>
            <p class="text-white-50">My AI model will analyze your MRI and detect possible brain tumor presence.</p>

            <form action="/predict" method="POST" enctype="multipart/form-data">

                <div class="upload-box mb-4">
                    <input class="form-control form-control-lg" type="file" name="file" required>
                </div>

                <button class="btn btn-info btn-lg w-100 fw-bold shadow">
                    🔍 Analyze MRI Image
                </button>

            </form>
        </div>

    </div>

</body>
</html>
