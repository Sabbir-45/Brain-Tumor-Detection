<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result | Brain Tumor Detection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom right, #0d1b2a, #1b263b, #415a77);
            color: white;
            min-height: 100vh;
        }

        .card-glass {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .progress {
            height: 30px;
            border-radius: 20px;
        }

        .progress-bar {
            background: linear-gradient(to right, #00d4ff, #0084ff);
            font-size: 18px;
            font-weight: bold;
        }

        img {
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow-lg py-3">
        <div class="container">
            <span class="navbar-brand fw-bold fs-3">🧠 Brain Tumor Detection</span>
        </div>
    </nav>

    <div class="container py-5">

        <div class="card-glass mx-auto shadow-lg" style="max-width: 750px;">

            <h2 class="text-center mb-4">AI Prediction Result</h2>

            <!-- Image -->
            <div class="text-center mb-4">
                <img src="/uploads/{{ image_file }}" class="img-fluid shadow" style="max-height: 340px;">
            </div>

            <!-- Result -->
            <h3 class="text-center mb-3">
                {% if "Yes" in result %}
                    <span class="badge bg-danger p-3 fs-4">{{ result }}</span>
                {% else %}
                    <span class="badge bg-success p-3 fs-4">{{ result }}</span>
                {% endif %}
            </h3>

            <!-- Confidence Bar -->
            <label class="fw-bold">Confidence Score: {{ score }}%</label>

            <div class="progress mb-4">
                <div class="progress-bar" role="progressbar"
                     style="width: {{ score|default(0) }}%"
                     aria-valuenow="{{ score }}" aria-valuemin="0" aria-valuemax="100">
                    {{ score }}%
                </div>
            </div>

            <div class="text-center">
                <a href="/" class="btn btn-light btn-lg px-4">🔄 Upload Another</a>
            </div>

        </div>

    </div>

</body>
</html>
